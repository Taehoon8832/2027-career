        if (!grid) return;
        if (!students.length) {
          grid.innerHTML = `<p class="settings-sub" style="grid-column:1/-1">명단이 없습니다. 초기 설정에서 학급을 저장해 주세요.</p>`;
          return;
        }
        const meta = classMetaById(activeClassId || teacherClass?.id);
        const grade = meta?.grade || 1;
        const classNo = meta?.class_no || 1;
        const parts = new Array(students.length);
        for (let i = 0; i < students.length; i++) {
          const st = students[i];
          const key = resolveRosterStudentKey(st.student_no, grade, classNo);
          const list = detailSubMap.get(key) || detailSubMap.get(normalizeStudentNo(st.student_no)) || [];
          const latest = list[0] || null;
          const summary = latest
            ? previewText(htmlToPlainTextFast(latest.content), 72) || "(내용 없음)"
            : "미제출";
          const preview = latest
            ? `<div class="detail-sub-preview" data-tab-detail="${latest.id}" title="새 탭으로 크게 보기"><div class="plain-mini">${escapeHtml(summary)}</div></div>`
            : `<div class="detail-sub-preview"><div class="plain-mini is-empty">미제출</div></div>`;
          const actions = latest
            ? `<div class="detail-sub-actions">
                 <button type="button" data-tab-detail="${latest.id}">새 탭</button>
                 <button type="button" class="is-danger" data-del-detail="${latest.id}">삭제</button>
               </div>`
            : "";
          parts[i] = `
            <div class="detail-roster-cell${latest ? " has-sub" : ""}">
              <div class="head">
                <span class="no">${escapeHtml(key || st.student_no)}</span>
                <span class="dot" aria-hidden="true" title="${latest ? "제출됨" : "미제출"}"></span>
              </div>
              <div class="name" title="${escapeHtml(st.student_name || latest?.student_name || "")}">${escapeHtml(st.student_name || latest?.student_name || "이름 없음")}</div>
              ${preview}
              ${actions}
            </div>`;
        }
        grid.innerHTML = parts.join("");

        if (!grid.dataset.bound) {
          grid.dataset.bound = "1";
          grid.addEventListener("click", async (e) => {
            const del = e.target.closest("[data-del-detail]");
            if (del) {
              e.stopPropagation();
              const id = del.getAttribute("data-del-detail");
              if (!id || !confirm("이 제출 보고서를 삭제할까요?")) return;
              await deleteSubmission(id);
              return;
            }
            const tab = e.target.closest("[data-tab-detail]");
            if (tab) {
              openSubmissionInNewTab(tab.getAttribute("data-tab-detail"));
              return;
            }
          });
        }
      }

      async function renderDetail(lesson, opts = {}) {
        showRightPanel("lesson");
        const card = $("detailCard");
        if (!lesson) {
          card.innerHTML = `<p class="sub-empty">왼쪽에서 차시를 선택하면 제출코드와 학번별 보고서를 확인할 수 있습니다.</p>`;
          return;
        }
        if (!isClassSettingsReady()) {
          card.innerHTML = `
            <p class="sub-empty">
              먼저 왼쪽 <strong>초기 설정</strong>에서 학급을 지정해 주세요.
            </p>`;
          return;
        }

        detailFilterGrade = Number(teacherClass?.grade || detailFilterGrade || classSettings.classGrade || 1);
        const gradesWithClasses = [1, 2, 3].filter((g) => activeClassesForGrade(g).length);
        if (!gradesWithClasses.includes(detailFilterGrade) && gradesWithClasses.length) {
          detailFilterGrade = gradesWithClasses[0];
        }

        const meta = getLessonMeta(lesson.session_no);
        const submitCode = lessonSubmitCode(lesson) || "--------";
        const url = activityUrl(lesson.session_no, lessonSubmitCode(lesson));
        const classId = teacherClass?.id || lesson.class_id;

        const classLabel = teacherClass ? unitLabel(teacherClass) : "";
        card.innerHTML = `
          <div class="detail-hero">
            <h2>${lesson.session_no}차시 · ${escapeHtml(meta.title)}</h2>
            <span class="theme">${escapeHtml(meta.monthLabel)} · ${escapeHtml(meta.theme)}</span>
          </div>

          <div class="detail-filter">
            <span class="lab">학년</span>
            <div class="chip-row" id="detailGradeChips"></div>
            <span class="sep" aria-hidden="true"></span>
            <span class="lab">반</span>
            <div class="chip-row" id="detailClassChips"></div>
          </div>

          <div class="detail-action-strip">
            <div class="qr" id="detailQr" aria-label="활동지 QR"></div>
            <div class="meta">
              <div class="code-row">
                <span class="label">제출코드</span>
                <strong id="lessonSubmitCodeValue">${escapeHtml(submitCode)}</strong>
                <button type="button" class="btn-tiny" id="btnCopySubmitCode">복사</button>
              </div>
              <div class="class-tag" style="margin-top:6px">${escapeHtml(classLabel || "학급 선택")}</div>
            </div>
            <div class="btns">
              <button type="button" class="btn btn-primary" id="btnOpenActivity">활동지 열기</button>
              <button type="button" class="btn btn-secondary" id="btnCopyLink">링크 복사</button>
            </div>
          </div>

          <div class="detail-toolbar">
            <h3 class="detail-section-title">제출 현황</h3>
            <span class="settings-sub" style="margin:0" id="detailSubmitCount">…</span>
            <span class="grow"></span>
          </div>
          <div class="detail-roster-grid is-loading" id="detailRosterGrid">
            <p class="settings-sub" style="grid-column:1/-1">불러오는 중…</p>
          </div>`;

        const gradeRoot = $("detailGradeChips");
        (gradesWithClasses.length ? gradesWithClasses : [detailFilterGrade]).forEach((g) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip-toggle" + (Number(detailFilterGrade) === g ? " is-on" : "");
          btn.textContent = `${g}학년`;
          btn.addEventListener("click", () => {
            if (Number(detailFilterGrade) === g && Number(teacherClass?.grade) === g) return;
            const list = activeClassesForGrade(g);
            if (!list.length) {
              toast(`${g}학년에 저장된 학급이 없습니다.`);
              return;
            }
            const prefer = list.find((c) => c.id === activeClassId) || list[0];
            switchDetailClass(prefer, lesson.session_no);
          });
          gradeRoot.appendChild(btn);
        });

        const classRoot = $("detailClassChips");
        const classesForGrade = activeClassesForGrade(detailFilterGrade);
        if (!classesForGrade.length) {
          classRoot.innerHTML = `<span class="settings-sub" style="margin:0">학급 없음</span>`;
        } else {
          classesForGrade.forEach((c) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "chip-toggle" + (c.id === activeClassId ? " is-on" : "");
            btn.textContent = `${c.class_no}반`;
            btn.addEventListener("click", () => {
              if (c.id === activeClassId) return;
              switchDetailClass(c, lesson.session_no);
            });
            classRoot.appendChild(btn);
          });
        }

        requestAnimationFrame(() => paintQr($("detailQr"), url, 64));
        $("btnOpenActivity").addEventListener("click", () => window.open(url, "_blank", "noopener"));
        $("btnCopyLink").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(url);
            toast("링크를 복사했습니다.");
          } catch {
            toast(url);
          }
        });
        $("btnCopySubmitCode")?.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(submitCode);
            toast("제출코드를 복사했습니다.");
          } catch {
            toast(submitCode);
          }
        });

        if (!classId) return;
        const students = await loadDetailStudentsAndSubs(classId, lesson.id, lesson.session_no);
        if (opts.switchSeq != null && opts.switchSeq !== switchSeq) return;

        const submittedCount = [...detailSubMap.values()].filter((arr) => arr.length).length;
        const countEl = $("detailSubmitCount");
        if (countEl) countEl.textContent = `${submittedCount}/${students.length}명 제출`;
        const grid = $("detailRosterGrid");
        if (grid) grid.classList.remove("is-loading");
        paintDetailRosterGrid(students);
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function selectLesson(lessonId, silent) {
        selectedLessonId = lessonId;
        const lesson = lessons.find((l) => l.id === lessonId);
        document.querySelectorAll(".lesson-item").forEach((el) => {
          el.classList.toggle("is-active", el.dataset.id === lessonId);
        });
        showRightPanel("lesson");
        if (isCompactDash()) setDashPanel("detail");
        await renderDetail(lesson);
        if (!silent && lesson) {
          // 선택 차시 카운트만 갱신 (전체 await 제거)
          countSubs(lesson.id).then((n) => {
            const badge = document.querySelector(`.lesson-item[data-id="${lesson.id}"] .lesson-count`);
            if (badge) badge.textContent = String(n);
          });
        }
        subscribeRealtime(lessonId);
      }

      function unsubscribeRealtime() {
        if (realtimeChannel && sb) {
          sb.removeChannel(realtimeChannel);
          realtimeChannel = null;
        }
      }

      function subscribeRealtime(lessonId) {
        unsubscribeRealtime();
        if (!sb || !lessonId) return;
        realtimeChannel = sb
          .channel("subs-" + lessonId)
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "submissions", filter: `lesson_id=eq.${lessonId}` },
            async () => {
              if (lessonId) subCountCache.delete(lessonId);
              renderLessonList();
              const current = lessons.find((l) => l.id === selectedLessonId);
              if (current && $("detailCard") && !$("detailCard").hidden) {
                await renderDetail(current);
              }
            }
          )
          .subscribe();
      }

      async function openTeacherDashboard() {
        if (!session) {
          showLogin();
          toast("로그인이 필요합니다.");
          return;
        }
        try {
          showView("teacher");
          const label = session.name || session.loginId || "교사";
          renderTeacherBarSwitcher();
          updateSetupLaunchHint();
          showRightPanel(isClassSettingsReady() ? "lesson" : "setup");
          setDashPanel("list");
          await loadLessons();
          await renderLessonList();
          renderTeacherBarSwitcher();
          if (isClassSettingsReady() && lessons.length) await selectLesson(lessons[0].id);
        } catch (e) {
          console.error(e);
          toast("대시보드를 불러오지 못했습니다: " + (e.message || e));
        }
      }

      async function loginTeacher() {
        const loginId = $("loginId").value;
        const password = $("password").value;
        const err = validateLogin(loginId, password);
        if (err) return setMsg($("authMsg"), err, "error");
        if (!sb) return setMsg($("authMsg"), "Supabase 연결에 실패했습니다.", "error");

        const btn = $("btnLogin");
        btn.disabled = true;
        try {
          const email = await resolveAuthEmail(loginId);
          let { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error && email !== idToLegacyAuthEmail(loginId)) {
            ({ data, error } = await sb.auth.signInWithPassword({
              email: idToLegacyAuthEmail(loginId),
              password
            }));
          }
          if (error) {
            setMsg($("authMsg"), "로그인 실패: " + (error.message || "아이디 또는 비밀번호를 확인해 주세요."), "error");
            return;
          }
          applyAuthUser(data.user);
          await enrichSessionFromProfile();
          showWelcome(session);
          toast("로그인되었습니다.");
        } finally {
          btn.disabled = false;
        }
      }

      async function signupTeacher() {
        const schoolName = $("schoolName").value.trim();
        const teacherName = $("teacherName").value.trim();
        const email = stripUppercase($("teacherEmail").value).trim().toLowerCase();
        const loginId = normalizeLoginId($("loginId").value);
        const password = $("password").value;
        const passwordConfirm = $("passwordConfirm").value;
        const err = validateSignup(schoolName, teacherName, email, loginId, password, passwordConfirm);
        if (err) return setMsg($("authMsg"), err, "error");
        if (!sb) return setMsg($("authMsg"), "Supabase 연결에 실패했습니다.", "error");

        const btn = $("btnSignup");
        btn.disabled = true;
        try {
          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: {
              data: {
                login_id: loginId,
                school_name: schoolName,
                display_name: teacherName,
                email
              }
            }
          });
          if (error) {
            console.error("signup error:", error);
            const raw = error.message || "회원가입에 실패했습니다.";
            let msg = raw;
            if (/already|registered|exists/i.test(raw)) {
              msg = "이미 사용 중인 이메일입니다. Authentication → Users에서 삭제 후 다시 시도해 주세요.";
            } else if (/database error saving new user/i.test(raw)) {
              msg = "DB 트리거 오류입니다. supabase-disable-trigger.sql 을 실행한 뒤 Users에서 해당 이메일을 삭제하고 다시 가입해 주세요.";
            }
            setMsg($("authMsg"), "회원가입 실패: " + msg, "error");
            return;
          }
          if (!data.session) {
            setMsg($("authMsg"), "회원가입이 완료되었습니다. 이메일 인증이 켜져 있으면 Authentication → Providers → Email에서 Confirm email을 끄고 다시 로그인해 주세요.", "ok");
            toast("회원가입이 완료되었습니다.");
            setAuthMode("login");
            return;
          }
          applyAuthUser(data.user);
          await ensureTeacherProfile({
            loginId,
            email,
            schoolName,
            name: teacherName
          });
          try { await ensureTeacherClassSeeded(); } catch (e) { console.warn(e); }
          showWelcome(session);
          toast("회원가입이 완료되었습니다.");
        } finally {
          btn.disabled = false;
        }
      }

      async function logout() {
        unsubscribeRealtime();
        if (sb) {
          try { await sb.auth.signOut(); } catch (_) {}
        }
        applyAuthUser(null);
        lessons = [];
        selectedLessonId = null;
        teacherClass = null;
        teacherClasses = [];
        activeClassId = null;
        showLogin();
        showView("landing");
        toast("로그아웃되었습니다.");
      }

      async function openStudent(token) {
        showView("student");
        studentLesson = null;
        setMsg($("studentMsg"), "");

        if (!sb) {
          $("studentTitle").textContent = "서버 미연결";
          $("studentSub").textContent = "잠시 후 다시 시도해 주세요.";
          $("studentForm").style.display = "none";
          return;
        }

        const { data, error } = await sb.rpc("get_lesson_by_token", { p_token: token });
        const row = Array.isArray(data) ? data[0] : data;
        if (error || !row) {
          $("studentTitle").textContent = "유효하지 않은 QR";
          $("studentSub").textContent = "교사에게 새 QR을 요청해 주세요.";
          $("studentForm").style.display = "none";
          return;
        }
        studentLesson = { ...row, token };
        const meta = getLessonMeta(studentLesson.session_no);

        $("studentForm").style.display = "";
        $("studentSessionChip").textContent = `${studentLesson.session_no}차시`;
        $("studentTitle").textContent = `${studentLesson.session_no}차시 · ${meta.title}`;
        $("studentSub").textContent = meta.summary
          ? `${meta.summary} 학번·이름과 함께 제출해 주세요.`
          : "학번·이름과 함께 이번 차시 자료를 제출해 주세요. 제출 즉시 교사 화면에 표시됩니다.";
      }

      async function submitStudent(e) {
        e.preventDefault();
        if (!studentLesson || !sb) return;
        const student_no = $("studentNo").value.trim();
        const student_name = $("studentName").value.trim();
        const content = $("studentContent").value.trim();
        if (!student_no || !student_name || !content) {
          setMsg($("studentMsg"), "모든 항목을 입력해 주세요.", "error");
          return;
        }

        const btn = $("btnStudentSubmit");
        btn.disabled = true;
        try {
          const { error } = await sb.from("submissions").insert({
            lesson_id: studentLesson.id,
            student_no,
            student_name,
            content
          });
          if (error) throw error;
          setMsg($("studentMsg"), "제출되었습니다. 감사합니다!", "ok");
          toast("제출 완료");
          $("studentContent").value = "";
        } catch (err) {
          console.error(err);
          setMsg($("studentMsg"), err.message || "제출에 실패했습니다.", "error");
        } finally {
          btn.disabled = false;
        }
      }

      async function restoreSession() {
        if (!sb) return null;
        const { data: { session: authSession } } = await sb.auth.getSession();
        applyAuthUser(authSession?.user || null);
        if (session) await enrichSessionFromProfile();
        return session;
      }

      bindNoUppercase(["schoolName", "teacherName", "teacherEmail", "loginId", "password", "passwordConfirm"]);

      // Events
      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        if (authMode === "signup") signupTeacher();
        else loginTeacher();
      });
      $("btnSignup").addEventListener("click", () => signupTeacher());
      $("btnShowSignup").addEventListener("click", () => setAuthMode("signup"));
      $("btnShowLogin").addEventListener("click", () => setAuthMode("login"));
      $("btnSubViewerClose")?.addEventListener("click", () => closeSubViewer());
      $("btnSubViewerDelete")?.addEventListener("click", async () => {
        if (!viewingSubmissionId) return;
        if (!confirm("이 제출 보고서를 삭제할까요?")) return;
        await deleteSubmission(viewingSubmissionId);
      });
      $("subViewer")?.addEventListener("click", (e) => {
        if (e.target === $("subViewer")) closeSubViewer();
      });
      $("btnOpenSetup").addEventListener("click", async () => {
        showRightPanel("setup");
        try {
          await loadTeacherClassesFromDb();
          renderClassSettingsUI();
          if (rosterClassId || activeClassId) await loadRoster(rosterClassId || activeClassId);
        } catch (e) {
          console.warn(e);
        }
      });
      $("btnClassCountMinus")?.addEventListener("click", () => adjustClassCount(-1));
      $("btnClassCountPlus")?.addEventListener("click", () => adjustClassCount(1));
      $("classCountInput")?.addEventListener("change", () => applyClassCountInput());
      $("classCountInput")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          applyClassCountInput();
          $("btnSaveClassSettings")?.click();
        }
      });
      $("btnAddStudent").addEventListener("click", () => addRosterStudent());
      $("btnAddStudentRow")?.addEventListener("click", () => addRosterStudents(5));
      $("btnSaveClassSettings").addEventListener("click", async () => {
        applyClassCountInput();
        if (!clampClassCount(classSettings.classCount)) {
          return toast("학급 수를 1개 이상으로 설정해 주세요.");
        }
        const btn = $("btnSaveClassSettings");
        btn.disabled = true;
        try {
          saveClassSettings();
          await syncClassGroupsToDb();
          updateSetupLaunchHint();
          renderClassSettingsUI();
          renderTeacherBarSwitcher();
          selectedLessonId = null;
          await loadLessons({ seed: true });
          renderLessonList();
          showRightPanel("setup");
          toast(`학급 ${classSettings.classCount}개 저장 완료`);
        } catch (e) {
          console.error(e);
          toast("저장 실패: " + (e.message || e) + " (supabase-students.sql 실행 여부 확인)");
        } finally {
          btn.disabled = false;
        }
      });
      $("tabDashList").addEventListener("click", () => setDashPanel("list"));
      $("tabDashDetail").addEventListener("click", () => setDashPanel("detail"));
      $("btnLogout").addEventListener("click", () => logout());
      $("btnTeacherLogout").addEventListener("click", () => logout());
      $("topGradeSelect")?.addEventListener("change", () => {
        const g = Number($("topGradeSelect").value);
        const list = activeClassesForGrade(g);
        const classSel = $("topClassSelect");
        if (classSel) {
          classSel.innerHTML = list.length
            ? list.map((c) => `<option value="${c.id}">${c.class_no}반</option>`).join("")
            : `<option value="">학급 없음</option>`;
          classSel.disabled = !list.length;
          if (list.length) classSel.value = list[0].id;
        }
        queueSwitchFromTopbar();
      });
      $("topClassSelect")?.addEventListener("change", () => queueSwitchFromTopbar());
      $("btnResetDashboard")?.addEventListener("click", () => resetTeacherDashboard());
      $("btnExportAllXlsx")?.addEventListener("click", () => exportAllSubmissionsXlsx());
      $("btnBackLanding").addEventListener("click", () => {
        unsubscribeRealtime();
        showView("landing");
        if (session) showWelcome(session);
        else showLogin();
      });
      $("btnStart").addEventListener("click", () => openTeacherDashboard());
      $("studentForm").addEventListener("submit", submitStudent);

      async function boot() {
        initSupabase();
        if (!sb) {
          showView("landing");
          setMsg($("authMsg"), "Supabase 연결에 실패했습니다.", "error");
          return;
        }

        sb.auth.onAuthStateChange((_event, authSession) => {
          applyAuthUser(authSession?.user || null);
        });

        const token = getQueryToken();
        if (token) {
          await openStudent(token);
          return;
        }

        await restoreSession();
        showView("landing");
        if (session) showWelcome(session);
        else showLogin();
      }

      boot();
    })();
  </script>
</body>
</html>
