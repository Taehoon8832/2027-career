<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>21차시 · 대입 수시 모의 지원</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css?v=prt17" />
  <script>window.ACTIVITY_SESSION = 21;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">21차시 활동</span>
      <strong>대입 수시 모의 지원</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">8월 · 진로 데이터 아카이빙과 대입 수시 매칭</div>
        <h1>21차시 · 대입 수시 모의 지원</h1>
        <p>수시 6장 카드 조합과 특수대 매칭.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">수시 카드 1~3</label>
          <input id="f1" name="f1" type="text" placeholder="대학-학과-전형" />
        </div>
        <div class="field">
          <label for="f2">수시 카드 4~6</label>
          <input id="f2" name="f2" type="text" placeholder="대학-학과-전형" />
        </div>
      </div>
      <div class="field">
        <label for="f3">특수대/전략 메모</label>
        <textarea id="f3" name="f3" placeholder="사관학교 등"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js?v=prt17"></script>
</body>
</html>
