<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>25차시 · 3대 AI 자기소개서 치트키</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css" />
  <script>window.ACTIVITY_SESSION = 25;</script>
  <script src="../vendor/qrcode.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">25차시 활동</span>
      <strong>3대 AI 자기소개서 치트키</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">9월 · 디지털 진로 포트폴리오와 AI 웹 완성</div>
        <h1>25차시 · 3대 AI 자기소개서 치트키</h1>
        <p>핵심 스토리라인 뼈대 빌드업.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" target="_blank" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">핵심 스토리</label>
          <input id="f1" name="f1" type="text" placeholder="한 줄 테마" />
        </div>
        <div class="field">
          <label for="f2">근거 활동</label>
          <input id="f2" name="f2" type="text" placeholder="연결 활동" />
        </div>
      </div>
      <div class="field">
        <label for="f3">자소서 초고</label>
        <textarea id="f3" name="f3" placeholder="작성한 초고"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js"></script>
</body>
</html>
