<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3차시 · 전공 빙고 & 직업 월드컵</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css" />
  <script>window.ACTIVITY_SESSION = 3;</script>
  <script src="../vendor/qrcode.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">3차시 활동</span>
      <strong>전공 빙고 & 직업 월드컵</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">3월 · 진로 탐색과 AI 기초 역량 빌드업</div>
        <h1>3차시 · 전공 빙고 & 직업 월드컵</h1>
        <p>게임을 통해 1순위 관심 학과와 2순위 차순위 학과를 자연스럽게 도출하는 교실 흥미 유발 차시.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" target="_blank" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">1순위 학과</label>
          <input id="f1" name="f1" type="text" placeholder="예: 컴퓨터공학과" />
        </div>
        <div class="field">
          <label for="f2">2순위 학과</label>
          <input id="f2" name="f2" type="text" placeholder="예: 경영학과" />
        </div>
      </div>
      <div class="field">
        <label for="f3">선택한 이유</label>
        <textarea id="f3" name="f3" placeholder="월드컵/빙고에서 이긴 이유"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js"></script>
</body>
</html>
