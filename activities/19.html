<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>19차시 · 전공 연계 봉사 기획</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css?v=draft1" />
  <script>window.ACTIVITY_SESSION = 19;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">19차시 활동</span>
      <strong>전공 연계 봉사 기획</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">7월 · AI 모의 학종 진단과 방학 진로 플래닝</div>
        <h1>19차시 · 전공 연계 봉사 기획</h1>
        <p>방학 중 실행 가능한 봉사 기획서.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">봉사 주제</label>
          <input id="f1" name="f1" type="text" placeholder="연계 주제" />
        </div>
        <div class="field">
          <label for="f2">대상/장소</label>
          <input id="f2" name="f2" type="text" placeholder="어디서 누구에게" />
        </div>
      </div>
      <div class="field">
        <label for="f3">기대 효과</label>
        <textarea id="f3" name="f3" placeholder="사회적 의미"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    
      <div class="field reflect-field" data-reflect="1">
        <label for="fReflect">느낀점(세특 참조)</label>
        <textarea id="fReflect" name="fReflect" rows="4" placeholder="오늘 활동에서 느낀 점, 배운 점, 성장한 점을 적어 주세요. (생기부 세특 작성 시 참고됩니다)"></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js?v=draft1"></script>
</body>
</html>
