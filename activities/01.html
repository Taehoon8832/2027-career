<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>1차시 · 디지털 나 사용 설명서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css" />
  <script>window.ACTIVITY_SESSION = 1;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">1차시 활동</span>
      <strong>디지털 나 사용 설명서</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="theme">3월 · 진로 탐색과 AI 기초 역량 빌드업</div>
      <h1>1차시 · 디지털 나 사용 설명서</h1>
      <p>QR 스캔 한 번으로 학생들이 온라인 양식에 자아 탐색 데이터를 채우는 첫 시간 수업 치트키.</p>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">나의 키워드 3개</label>
          <input id="f1" name="f1" type="text" placeholder="예: 호기심, 분석, 공감" />
        </div>
        <div class="field">
          <label for="f2">요즘 나를 설명하는 한 문장</label>
          <input id="f2" name="f2" type="text" placeholder="나는 ___한 사람이다" />
        </div>
      </div>
      <div class="field">
        <label for="f3">관심 있는 진로/직업</label>
        <textarea id="f3" name="f3" placeholder="예: UX 디자이너"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./submit.js"></script>
</body>
</html>
