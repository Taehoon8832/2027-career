<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>1차시 · 디지털 나 사용 설명서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css?v=prt20" />
  <script>window.ACTIVITY_SESSION = 1;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">1차시 활동</span>
      <strong>디지털 나 사용 설명서</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">3월 · 진로 탐색과 AI 기초 역량 빌드업</div>
        <h1>1차시 · 디지털 나 사용 설명서</h1>
        <p>서로를 이해하고 즐거운 학급 문화를 만들기 위한 상세 안내서</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>

    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="na-manual">
        <header class="na-manual-head">
          <strong>'나' 사용 설명서</strong>
        </header>

        <div class="na-manual-grid">
          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">📌</span>
              <label for="f1">기본 스펙 &amp; 키워드</label>
            </div>
            <textarea id="f1" name="f1" placeholder="• 별명: 인간 비타민, 쿼카&#10;• MBTI / 성격: ENFP (밝고 리액션 좋은 편)&#10;• 나를 한 단어로 표현하면?: '웃음 버튼'"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">⚡</span>
              <label for="f2">주요 기능 (장점 &amp; 능력)</label>
            </div>
            <textarea id="f2" name="f2" placeholder="• 고민 들어주기 &amp; 공감 잘하기&#10;• 분위기 띄우기 및 텐션 올려주기&#10;• 약속 시간 칼같이 잘 지키기"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🔋</span>
              <label for="f3">전원 충전법 (좋아하는 것)</label>
            </div>
            <textarea id="f3" name="f3" placeholder="• 시원한 초코우유나 버블티 마시기&#10;• 좋아하는 노래 들으며 혼자 산책&#10;• '오늘 수고했어'라는 말 한마디 듣기"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">⚠️</span>
              <label for="f4">주의 사항 (경고)</label>
            </div>
            <textarea id="f4" name="f4" placeholder="• 배고플 때 건드리면 예민해짐!&#10;• 뒷담화나 장난빙자한 거짓말은 싫어요&#10;• 빌려간 물건은 제자리에 돌려주기"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🔔</span>
              <label for="f5">알림 설정 (듣고 싶은 말)</label>
            </div>
            <textarea id="f5" name="f5" placeholder="• 지쳤을 때 듣고 싶은 응원: '지금도 충분히 잘하고 있어!'&#10;• 칭찬받고 싶은 부분: 모둠 활동 열일할 때&#10;• 들으면 하루 종일 기분 좋아지는 말 한마디"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🔗</span>
              <label for="f6">연결 &amp; 호환성 (잘 맞는 유형)</label>
            </div>
            <textarea id="f6" name="f6" placeholder="• 내 드립에 리액션 잘 해주는 친구 (시너지 200%)&#10;• 솔직하게 대화하고 신뢰를 중요시하는 사람&#10;• 같이 맛있는 디저트 먹으러 다닐 파트너"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🎁</span>
              <label for="f7">숨겨진 이스터에그 (반전 매력)</label>
            </div>
            <textarea id="f7" name="f7" placeholder="• 얌전해 보이지만 친해지면 장난기 폭발함&#10;• 게임 실행 시 예상외로 고수의 실력 발휘&#10;• 겉으론 덤덤해 보여도 속으론 감동 잘 받음"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">💡</span>
              <label for="f8">기본 탑재 가치관 (소중한 가치)</label>
            </div>
            <textarea id="f8" name="f8" placeholder="• '배려': 남에게 피해 주지 않고 먼저 생각하기&#10;• '솔직함': 숨기지 않고 진심으로 대하기&#10;• 인생 모토: '지나간 일에 너무 연연하지 말자!'"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">📶</span>
              <label for="f9">네트워크 확장 (관심 진로 &amp; 과목)</label>
            </div>
            <textarea id="f9" name="f9" placeholder="• 관심 진로/직업 분야: AI 서비스 기획 / 마케팅&#10;• 수강 희망 과목: 심리학, 프로그래밍&#10;• 탐색하고 싶은 주제: 인공지능과 사회"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🧩</span>
              <label for="f10">모듈 조합 (모둠 선호 역할)</label>
            </div>
            <textarea id="f10" name="f10" placeholder="• 선호 역할: 자료 조사, PPT 디자인, 발표, 서기&#10;• 팀 내 기여점: 분위기 매니저 및 일정 관리&#10;• 역할 분담이 명확할 때 최고의 시너지 발휘"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🛡️</span>
              <label for="f11">백신 프로그램 (스트레스 방어)</label>
            </div>
            <textarea id="f11" name="f11" placeholder="• 시험 스트레스 방어 주문: '이 또한 지나가리라!'&#10;• 멘탈 관리법: 맛있는 디저트 먹기, 음악 들으며 산책&#10;• 지쳤을 때 나만의 힐링 루틴 실천하기"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">💾</span>
              <label for="f12">최근 데이터 저장 (최대 관심사)</label>
            </div>
            <textarea id="f12" name="f12" placeholder="• 요즘 뇌 용량의 80%를 차지하는 최대 관심사/취미&#10;• 쉬는 시간에 자주 생각하거나 검색하는 키워드&#10;• 친구들과 자주 이야기 나누고 싶은 핫이슈"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🛠️</span>
              <label for="f13">오작동 해결법 (화났거나 우울할 때)</label>
            </div>
            <textarea id="f13" name="f13" placeholder="• 기분이 안 좋아 보일 때: 10분만 혼자 생각할 시간 주기&#10;• 화를 풀어주는 꿀팁: 슬쩍 좋아하는 음료수 건네기&#10;• 우울해할 때: 맛있는 거 먹으러 가자고 말해주기"></textarea>
          </div>

          <div class="na-card">
            <div class="na-card-head">
              <span class="na-card-icon" aria-hidden="true">🚀</span>
              <label for="f14">미래 버전 업데이트 계획 (목표)</label>
            </div>
            <textarea id="f14" name="f14" placeholder="• v2.0 (이번 학기): 운동하기, 수학 성적 한 등급 상승&#10;• v3.0 (올해 목표): 새로운 친구 사귀기, 진로 책 읽기&#10;• 최종 지향점: 내 주관을 당당히 말하는 멋진 사람"></textarea>
          </div>
        </div>
      </div>
    
      <div class="field reflect-field" data-reflect="1">
        <label for="fReflect">느낀점(세특 참조)</label>
        <textarea id="fReflect" name="fReflect" rows="4" placeholder="오늘 활동에서 느낀 점, 배운 점, 성장한 점을 적어 주세요. (생기부 세특 작성 시 참고됩니다)"></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js?v=prt19"></script>
</body>
</html>
