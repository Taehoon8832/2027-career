<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>5차시 · 3대 AI 프롬프트 치트키</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css" />
  <script>window.ACTIVITY_SESSION = 5;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">5차시 활동</span>
      <strong>3대 AI 프롬프트 치트키</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="theme">3월 · 진로 탐색과 AI 기초 역량 빌드업</div>
      <h1>5차시 · 3대 AI 프롬프트 치트키</h1>
      <p>챗GPT, 제미나이, 클로드의 출력을 1등급 세특용으로 바꿔줄 만능 프롬프트 복붙 매뉴얼 전수.</p>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">사용한 AI</label>
          <input id="f1" name="f1" type="text" placeholder="ChatGPT / Gemini / Claude" />
        </div>
        <div class="field">
          <label for="f2">원본 프롬프트</label>
          <input id="f2" name="f2" type="text" placeholder="복사한 프롬프트" />
        </div>
      </div>
      <div class="field">
        <label for="f3">세특용으로 다듬은 결과</label>
        <textarea id="f3" name="f3" placeholder="결과 요약"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./submit.js"></script>
</body>
</html>
