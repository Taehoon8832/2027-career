<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>4차시 · 목표 대학 입결 스캔</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css?v=prt11" />
  <script>window.ACTIVITY_SESSION = 4;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">4차시 활동</span>
      <strong>목표 대학 입결 스캔</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">3월 · 진로 탐색과 AI 기초 역량 빌드업</div>
        <h1>4차시 · 목표 대학 입결 스캔</h1>
        <p>3대 AI와 대입 포털을 활용해 목표 학과의 전형, 전년도 등급 컷, 경쟁률을 직접 찾아 지도에 박아넣는 시간.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">목표 대학·학과</label>
          <input id="f1" name="f1" type="text" placeholder="예: OO대 컴퓨터공학과" />
        </div>
        <div class="field">
          <label for="f2">전형 유형</label>
          <input id="f2" name="f2" type="text" placeholder="학생부교과/종합/논술 등" />
        </div>
      </div>
      <div class="field">
        <label for="f3">전년도 등급컷/경쟁률 메모</label>
        <textarea id="f3" name="f3" placeholder="조사한 수치"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js?v=prt11"></script>
</body>
</html>
