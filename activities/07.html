<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- encoding-fix3 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>7차시 · 제미나이×캔바 카드뉴스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css?v=2054" />
  <script>window.ACTIVITY_SESSION = 7;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">7차시 활동</span>
      <strong>제미나이×캔바 카드뉴스</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">4월 · 데이터 기반 진학 진단과 AI 노코딩 시각화</div>
        <h1>7차시 · 제미나이×캔바 카드뉴스</h1>
        <p>AI가 요약해 준 나의 롤모델과 전공 비전을 캔바 디자인 템플릿에 얹어 시각화하는 활동.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">롤모델</label>
          <input id="f1" name="f1" type="text" placeholder="이름/직업" />
        </div>
        <div class="field">
          <label for="f2">전공 비전 한 줄</label>
          <input id="f2" name="f2" type="text" placeholder="내가 가고 싶은 방향" />
        </div>
      </div>
      <div class="field">
        <label for="f3">카드뉴스 핵심 메시지</label>
        <textarea id="f3" name="f3" placeholder="카드에 넣을 문장"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    
      <div class="field reflect-field" data-reflect="1">
        <label for="fReflect">느낀점(세특 참조)</label>
        <textarea id="fReflect" name="fReflect" rows="4" placeholder="오늘 활동에서 느낀 점, 배운 점, 성장한 점을 적어 주세요. (생기부 세특 작성 시 참고됩니다)"></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js?v=2054"></script>
</body>
</html>
