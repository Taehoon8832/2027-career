<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>26차시 · 내 생기부 기반 AI 면접 문항 생성</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css?v=prt2" />
  <script>window.ACTIVITY_SESSION = 26;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">26차시 활동</span>
      <strong>내 생기부 기반 AI 면접 문항 생성</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">10월 · AI 생기부 기반 대입 면접과 실전 스피치</div>
        <h1>26차시 · 내 생기부 기반 AI 면접 문항 생성</h1>
        <p>맞춤형 예상 질문 리스트 추출.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">예상 질문 1</label>
          <input id="f1" name="f1" type="text" placeholder="질문" />
        </div>
        <div class="field">
          <label for="f2">예상 질문 2</label>
          <input id="f2" name="f2" type="text" placeholder="질문" />
        </div>
      </div>
      <div class="field">
        <label for="f3">예상 질문 3</label>
        <textarea id="f3" name="f3" placeholder="질문"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js?v=prt2"></script>
</body>
</html>
