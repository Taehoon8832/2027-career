<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- encoding-fix3 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>16차시 · 3분 전공 스피치 발표</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./activity.css?v=fix5" />
  <script>window.ACTIVITY_SESSION = 16;</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="top-meta">
      <span class="chip">16차시 활동</span>
      <strong>3분 전공 스피치 발표</strong>
    </div>
  </div>
  <div class="shell">
    <section class="hero-card">
      <div class="hero-copy">
        <div class="theme">6월 · AI 융합 심화 탐구와 강력한 세특 빌드업</div>
        <h1>16차시 · 3분 전공 스피치 발표</h1>
        <p>서로 평가하며 세특 기록 소스 확보.</p>
      </div>
      <div class="hero-qr-wrap">
        <a class="hero-qr" id="activityPageQr" href="#" rel="noopener noreferrer" aria-label="활동지 QR — 눌러서 열기"></a>
        <span class="hero-qr-cap">눌러서 열기</span>
      </div>
    </section>
    <section class="activity-card" id="activity-root">
      <h2>학생 활동지</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f1">스피치 제목</label>
          <input id="f1" name="f1" type="text" placeholder="발표 제목" />
        </div>
        <div class="field">
          <label for="f2">핵심 메시지</label>
          <input id="f2" name="f2" type="text" placeholder="말할 내용" />
        </div>
      </div>
      <div class="field">
        <label for="f3">동료 피드백</label>
        <textarea id="f3" name="f3" placeholder="받은 평가"></textarea>
      </div>
      <div class="field">
        <label for="f4">추가로 남기고 싶은 내용</label>
        <textarea id="f4" name="f4" placeholder="오늘 활동에서 인상 깊었던 점, 질문, 아이디어를 적어 주세요."></textarea>
      </div>
    
      <div class="field reflect-field" data-reflect="1">
        <label for="fReflect">느낀점(세특 참조)</label>
        <textarea id="fReflect" name="fReflect" rows="4" placeholder="오늘 활동에서 느낀 점, 배운 점, 성장한 점을 적어 주세요. (생기부 세특 작성 시 참고됩니다)"></textarea>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="./submit.js?v=fix5"></script>
</body>
</html>
